<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Get Started | Prescott Organizing</title>
  <meta name="description" content="Schedule a Home Organization Consultation | Prescott Organizing in Prescott, AZ”">


  <link rel="stylesheet" href="style/style.css?v=1.0.4" type="text/css" media="all" />
  <link rel="icon" type="image/x-icon" href="media/favicon/favicon.ico">

  <!-- Link to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
    <!-- <img src="media/ref1.jpg" class="top-img"> -->
    <header class="site-header">
        <nav class="site-nav">
            <div class="nav-left">
            <!-- <a class="logo" href="/">Prescott <br> Organizing</a> -->
            <a href="/"><img src="media/logo/logo-outline2.svg" class="logo"></a>
            </div>
            <div class="nav-right">
            <a href="/about" class="nav-link link">About</a>
            <a href="/services" class="nav-link link">Services</a>
            <a href="/gallery" class="nav-link link">Gallery</a>
            <a href="/testimonials" class="nav-link link">Testimonials</a>
            <a href="/get-started" class="nav-link link gs" id="active-page">Get Started</a>
            </div>
        </nav>
    </header>
    <div class="main">

      <main class="content">
        <br><br>
        <h2 class="center">To get started, please give us a call or email!</h2>
        <div class="contact-row">
            <div class="contact-box">
              <a href="tel:9283505115" target="_blank" class="contact-link">
                <i class="fa fa-phone fa-2x nav-icon" title="Call Us"></i>
                <span class="contact-details">(928)-350-5115</span>
              </a>
            </div>
            <div class="contact-box">
              <a href="mailto:prescottorganizing@gmail.com" target="_blank" class="contact-link">
                <i class="fa fa-envelope fa-2x nav-icon" title="Email Us"></i>
                <span class="contact-details email">prescottorganizing@gmail.com</span>
              </a>
            </div>
        </div>

        <!-- CONTACT FORM -->
        <form action="https://formspree.io/f/mjkjvnyr" method="POST" class="contactform">
          <label class="cfitem">
            First Name
            <span class="mark-req">*</span>
            <input type="text" name="first" class="cfinput" required>
          </label>
          <label class="cfitem">
            Last Name
            <span class="mark-req">*</span>
            <input type="text" name="last" class="cfinput" required>
          </label class="cfitem">
          <label class="cfitem">
            Email Address
            <span class="mark-req">*</span>
            <input type="email" name="email" class="cfinput" required>
          </label>
          <label class="cfitem">
            Phone
            <input type="tel" name="phone" class="cfinput">
          </label>
          <label class="cfitem">
            Address Line 1
            <span class="mark-req">*</span>
            <input type="text" name="address" class="cfinput" required>
          </label>
          <label class="cfitem">
            Address Line 2
            <input type="text" name="address-2" class="cfinput">
          </label>
          <label class="cfitem">
            City
            <span class="mark-req">*</span>
            <input type="text" name="city" class="cfinput" required>
          </label>
          <label class="cfitem">
            State
            <span class="mark-req">*</span>
            <input type="text" name="state" class="cfinput" required>
          </label>
          <label class="cfitem">
            Postal Code
            <span class="mark-req">*</span>
            <input type="text" name="zip" class="cfinput" required>
          </label>
          <label class="cfitem">
            Your message
            <span class="mark-req">*</span>
            <textarea name="message" class="cfinput" required></textarea>
          </label>
          <label class="cfitem" for="refer">
            Referred By
            <span class="mark-req">*</span>
            <select name="refer" class="dropdown" required>
              <option value="" disabled selected>Select your option</option>
              <option value="wom">Word of Mouth</option>
              <option value="google">Google</option>
              <option value="soc">Social Media</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="cfitem" for="refer">
            Preferred Contact Method
            <span class="mark-req">*</span>
            <select name="pref-contact" class="dropdown" required>
              <option value="" disabled selected>Select your option</option>
              <option value="phone">Phone</option>
              <option value="email">Email</option>
              <option value="text">Text</option>
            </select>
          </label>
          <label class="cfitem" for="refer">
            Availability
            <span class="mark-req">*</span>
            <select name="availability" class="dropdown" required>
              <option value="" disabled selected>Select your option</option>
              <option value="weekday">Weekday</option>
              <option value="weekend">Weekend</option>
              <option value="variable">Variable</option>
            </select>
          </label>
          <button type="submit" class="cfsubmit">Send</button>
        </form>
        <br><br>
        <span class="mark-req">*</span> indicates a field is required

        <hr class="qline">
        
        <ul class="info-box center">
        <li class="info-head">CONTACT US</li>
        <hr class="info-separator">
        <li class="info-item"><a href="tel:9283505115" class="link" id="tel">(928)-350-5115</a></li>
        <li class="info-item"><a href="mailto:prescottorganizing@gmail.com" id="email" class="link">prescottorganizing@gmail.com</a></li> 
        </ul>

      </main>
    
    <footer class="footer">
      <p>&copy;2025 Prescott Organizing LLC</p>
    </footer>
  </div>

</body>
</html>
